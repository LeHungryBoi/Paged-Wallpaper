name: Build APK

# Build a fresh APK on every push; main-branch builds are also published as releases.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Only the newest commit of a branch matters; cancel superseded runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The repo ships only gradle-wrapper.properties (no gradlew scripts/jar),
      # so provision the matching Gradle version directly instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore
      # (alias "androiddebugkey", store/key password "android"). The keystore is
      # committed so every CI APK has the same signature and updates install over
      # old installs; this step only generates a throwaway one if it is missing.
      - name: Ensure debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Publish APK GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          apk_path="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "No debug APK was produced." >&2
            exit 1
          fi

          release_tag="build-${RUN_NUMBER}"
          asset_name="app-debug-${RUN_NUMBER}.apk"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk_path#$asset_name" --clobber
          else
            gh release create "$release_tag" "$apk_path#$asset_name" \
              --title "Debug build ${RUN_NUMBER}" \
              --notes "Automated debug APK for commit ${COMMIT_SHA}." \
              --target "$COMMIT_SHA"
          fi

      - name: Keep only the latest three APK releases
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const buildReleases = releases
              .map((release) => ({
                release,
                match: /^build-(\d+)$/.exec(release.tag_name)
              }))
              .filter(({ match }) => match !== null)
              .sort((a, b) => Number(b.match[1]) - Number(a.match[1]));

            for (const { release } of buildReleases.slice(3)) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${release.tag_name}`
              });
              core.info(`Deleted old APK release and tag: ${release.tag_name}`);
            }
